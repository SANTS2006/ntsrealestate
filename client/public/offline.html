<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>You are offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      img { width: 128px; max-width: 50%; margin-bottom: 24px; border-radius: 28px; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #94a3b8; }
      .btn { display: inline-block; background: #0b55d4; color: #fff; border-radius: 10px; padding: 10px 20px; font-size: 1rem; text-decoration: none; }
    </style>
  </head>
  <body>
    <div>
      <img src="/logo-nts.png" alt="" />
      <h1>You are offline</h1>
      <p>Check your connection, then try again.</p>
      <a class="btn" href="/">Try again</a>
    </div>
  </body>
</html>
